name: Publish StremioProxyWAN v0.2.2 stable
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.2.2.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-proxywan-v0.2.2
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify current version and run isolated unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.2.2"
          python3 -m py_compile stremioproxywan/*.py addon_auth/*.py
          sudo python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and validate Debian package and source archive
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/build.sh release-assets
          (cd release-assets && sha256sum -c SHA256SUMS)
          test "$(dpkg-deb --field release-assets/stremioproxywan_0.2.2_all.deb Version)" = "0.2.2"
          tar -tzf release-assets/stremioproxywan-0.2.2.tar.gz > /tmp/proxywan-release-contents.txt
          grep -Fx 'README.md' /tmp/proxywan-release-contents.txt
          grep -Fx 'tests/test_wan_server_seed.py' /tmp/proxywan-release-contents.txt
      - name: Publish verified stable WebPlayer WAN release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          if gh release view v0.2.2 >/dev/null 2>&1; then
            gh release upload v0.2.2 stremioproxywan_0.2.2_all.deb stremioproxywan-0.2.2.tar.gz SHA256SUMS --clobber
          else
            gh release create v0.2.2 stremioproxywan_0.2.2_all.deb stremioproxywan-0.2.2.tar.gz SHA256SUMS --target "$GITHUB_SHA" --title 'StremioProxyWAN v0.2.2 — stable authenticated WebPlayer WAN' --latest --notes-file ../docs/RELEASE-v0.2.2.md
          fi
          gh release view v0.2.2 --json tagName,isPrerelease,assets,url